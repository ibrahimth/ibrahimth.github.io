name: Build and deploy to gh-pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show node & npm versions
        run: |
          node -v
          npm -v
          uname -a

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: |
          set -e
          npm run build

      - name: Show dist contents
        if: success()
        run: |
          echo "dist size and listing:"
          du -sh dist || true
          ls -la dist || true
          find dist -maxdepth 3 -type f -print || true

      - name: Copy static course pages into dist
        run: |
          set -e
          if [ -d "COE526_Data_Privacy" ]; then
            cp -r COE526_Data_Privacy dist/ || true
          fi
          if [ -f "personal-website.html" ]; then
            cp personal-website.html dist/ || true
          fi
          echo "dist after copy:"
          ls -la dist || true

      - name: Fail if dist missing index.html
        run: |
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html not found — aborting deploy"
            ls -la dist || true
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
