};

Object.assign(lessons,{

});

 const standard=normalPair(sgU[0],sgU[1]),z=standard.map(x=>x*sigma);
 return{sum,standard,z,noisy:sum.map((x,i)=>x+z[i])};
}

function mathContent(){
 const notes={
 definition:'Neighboring datasets are defined by the allowed record domain and adjacency rule. The lab uses add/remove adjacency unless a section explicitly says replacement. DP quantifies over all output events. For discrete outputs, singleton probabilities can be used; continuous outputs are compared using densities or measurable sets.',
 sensitivity:'A global maximum over all allowed neighbors defines sensitivity. Public caps determine the domain. Observed changes are examples, not sufficient sensitivity proofs. Histogram replacement sensitivity can be 2; add/remove sensitivity is 1. A fixed-size mean in [0,B] has replacement sensitivity B/n.',
 bounds:'The sum uses public age bounds [0,100]. Under add/remove adjacency, the ratio of a noisy sum to a noisy count uses a sequential budget split. Flooring the noisy count and clipping the resulting mean use public rules and preserve the guarantee. They can introduce bias. Never assume B/n for a variable-denominator add/remove mean without an appropriate domain argument.',
 laplace:'For Δ₁f and ε>0, the Laplace scale is b=Δ₁f/ε. The density ratio is bounded by exp(|f(D)−f(D′)|/b) ≤ exp(ε), using the triangle inequality. Mean noise is 0, variance is 2b², and Pr(|η|>t)=exp(−t/b). A fresh draw on real private data is another release. The browser uses reproducible synthetic sampling for teaching, not production privacy software.',
 histogram:'Bin labels and the partition rule are public. One added or removed record belongs to one bin. Independent Laplace noise with scale 1/ε therefore privatizes the entire vector. Rounding and clamping do not restore totals automatically; additional public post-processing can be designed if needed.',
 budget:'Basic sequential composition adds ε and δ across releases that the same protected unit can influence. Parallel composition requires fixed disjoint protected units, rather than separate files. Public post-processing accesses private outputs and public information only. A correction that consults the true data again is not covered by the post-processing theorem. Repeated independent releases and averaging still compose.',
 group:'For pure ε-DP, c changed records give a cε group guarantee: multiply c neighboring probability-ratio bounds. This is not the same operation as composing c released answers. To target group ε_g, calibrate the one-person mechanism at ε_g/c. Approximate-DP group bounds require a corresponding δ analysis.',
 local:'The truth/flip probabilities are p=e^ε/(e^ε+1) and q=1/(e^ε+1). Conditional on fixed private bits, each report has variance pq; each debiased estimator has variance pq/(p−q)². Independent reports give n times this variance. The comparison uses the same one-bit protection level ε=ln3, but local DP removes the need to trust a curator with the original bit.',
 exponential:'Use a fixed public candidate set and a score with proven sensitivity Δu. Probabilities are proportional to exp(εu/(2Δu)). The score ratio and normalizer ratio each contribute at most exp(ε/2). The implementation subtracts the maximum score for numerical stability. As ε approaches 0 the probabilities become uniform; a large ε concentrates them on score maximizers. A public candidate with score 0 has positive weight. The movie example’s Δu=1 is an illustrative assumption, not a proof for arbitrary ratings-based scores.',
 noisymax:'The scale 1/ε here follows from releasing a disjoint add/remove vote histogram with sensitivity 1 and then reporting its maximum index. A fixed tie order is public. Generic overlapping scores may need scale 2Δ/ε or a specialized monotonicity analysis. The scale from this example must not be applied to arbitrary score vectors.',
 kmeans:'Coordinates are bounded in [0,1]²; k=3 and T=3 are fixed. Starting centers are public and independent of private points. Conditional on previous private centers, each point joins one cluster. The vector of sizes has L1 sensitivity 1 and all coordinate sums have L1 sensitivity 2. Each iteration receives ε/3, split equally into sizes and sums: scales 6/ε and 12/ε. Do not spend the sum budget separately on x and y. Ratios, clamping, and keeping a previous center when a noisy size is below 1 are post-processing. Exact assignments and raw points are internal. Ordinary k-means decreases its assignment/update objective; a noisy update need not.',
 recommend:'Ratings are bounded in [1,5] with a public fixed count n. Replacement of one rating changes the global mean by at most 4/n. A user can contribute many ratings, so rating-level and user-level guarantees are different. A recommender may combine global means, per-movie means, per-user statistics and covariance; each released component needs an appropriate sensitivity and accounting analysis. The displayed covariance is a population-style raw calculation, not a DP matrix release.',
 gaussian:'For 0<ε<1, the classical sufficient calibration is σ=Δ₂f√(2 ln(1.25/δ))/ε. The lab keeps δ=10⁻⁵ fixed for teaching. This is not a universally suitable δ choice or the tightest possible Gaussian calibration. δ is additive slack in Pr[M(D)∈S]≤exp(ε)Pr[M(D′)∈S]+δ, not a fraction of people exposed. Independent noise coordinates form an isotropic Gaussian vector.',
 descent:'For prediction ŷ=wx and half squared-error loss, a per-example gradient is (wx−y)x. Full-batch descent averages over all examples, SGD uses a sampled single example, and a mini-batch uses a small sample. The selected examples here are fixed illustrations. No DP mechanism is applied in this section.',
 dpsgd:'For the squared-loss example, θ=(0.4,0.6), C=1, B=5, and learning rate 0.1. Clip each per-example gradient, add independent-coordinate Gaussian noise to the sum, then average. The Box–Muller cosine/sine pair creates the two standard normal coordinates. A real DP-SGD claim requires a sampling rule, normalization and privacy accountant that agree. Under add/remove adjacency, adding one clipped gradient changes a sum by at most C; replacement can require a 2C bound. The full ε depends on the sampling rate, noise multiplier, number of steps, δ, and analysis. This illustration makes no model-level ε claim.',
 audit:'The event inequality gives TPR≤exp(ε)FPR+δ for valid neighboring membership experiments. For positive FPR and TPR>δ, rearrange it to ε≥ln((TPR−δ)/FPR). The lab stipulates exact rates for the arithmetic. Finite-sample audits need statistically valid confidence bounds, not a plug-in estimate alone. Failing to contradict a claim does not certify privacy.',
 guide:'Choose the mechanism for the public output and establish its protected unit, contribution bounds, randomness, and complete accounting. Privacy alone does not guarantee useful answers for every task or arbitrary data. High sensitivity, small groups, repeated access and many training steps can reduce utility. The research links are optional connections to the lecture papers.'
 };
 const reference=key==='dpsgd'?abadi:key==='audit'?'<a href="https://arxiv.org/abs/2305.08846" target="_blank" rel="noopener">Steinke, Nasr &amp; Jagielski (2023)</a>':book;
 return `<p>${esc(notes[key])}</p><p class="source">Lecture alignment: ${esc(lessons[key].lecture)}. Reference: ${reference}${key==='gaussian'?' (Appendix A)':key==='group'?' (Theorem 2.2)':''}.</p>`;
}

function normalPair(u,v){
 const radius=Math.sqrt(-2*Math.log(u)),angle=2*Math.PI*v;

function descentModel(){
 const x=[1,2,3],y=[2,3,5],w=1;
 const ids=descentBatch==='single'?[0]:descentBatch==='mini'?[0,1]:[0,1,2];
 const residual=x.map((v,i)=>w*v-y[i]),gradients=residual.map((r,i)=>r*x[i]);
 const gradient=ids.reduce((a,i)=>a+gradients[i],0)/ids.length,next=w-learningRate*gradient;
 const loss=ids.reduce((a,i)=>a+residual[i]**2,0)/(2*ids.length);
 const nextLoss=ids.reduce((a,i)=>a+(next*x[i]-y[i])**2,0)/(2*ids.length);
 return{x,y,w,ids,residual,gradients,gradient,next,loss,nextLoss};
}

function localModel(){
 const eps=Math.log(3),p=.75,q=.25,truth=localN*localFraction,expected=localN*q+(p-q)*truth;

 return{eps,p,q,truth,expected,variance,localSD:Math.sqrt(variance),centralSD:Math.SQRT2/eps};
}

function laplaceSampling(b,u,label='Noise draw'){
 const offset=u-.5,inside=1-2*Math.abs(offset),value=lap(b,u);
 return `<details class="calc-detail"><summary>${esc(label)} · how the random value was obtained</summary><div class="formula">U = ${f(u,6)} from Uniform(0, 1)<br>η = −b sign(U − 0.5) ln(1 − 2|U − 0.5|)<br>η = −${f(b,4)} × (${Math.sign(offset)}) × ln(${f(inside,6)}) ≈ ${f(value,4)}</div></details>`;
}

  if(step===3){add('Allowed TPR under the claim','exp(ε_claim) FPR + δ',`exp(${auditEpsilon}) × 0.05 + 0.00001`,`≈ ${f(allowed,6)}`);add('Check the observed rate','TPR ≤ claimed upper bound?',`0.30 ≤ ${f(allowed,6)} ?`,tpr>allowed?'No: contradiction':'Yes: no contradiction');}
  note='The rates here are treated as exact for arithmetic. A real audit must use valid confidence bounds and handle sampling error before declaring a violation. A lower bound below a claim does not prove DP.';
 }
 if(key==='guide'){
  if(step===0)table=tableMarkup(['Mechanism','Public output','Calibration','Guarantee'],[['Randomized response','One bit per user','Truth/flip probabilities','Local ε-DP'],['Laplace','Numeric scalar/vector','Δ₁/ε','ε-DP'],['Gaussian','Numeric scalar/vector','Δ₂, ε, δ','(ε,δ)-DP'],['Exponential','One candidate','Utility sensitivity Δu','ε-DP'],['Report noisy max','Winning index','Here: disjoint counts, b=1/ε','ε-DP'],['DP-SGD','Model weights','C, σ, sampling, steps + accountant','(ε,δ)-DP']]);
  if(step===1){add('Fixed total budget across T iterations','ε_iteration = ε_total/T','ε_total = 1; T = 5','0.2 per iteration');add('Split counts and 2D sums equally','ε_part = 0.2/2; b = Δ/ε_part','Count Δ=1; sum vector Δ=2','b_count = 10; b_sum = 20');table=tableMarkup(['Lecture’s rough numerator-noise scale','Calculation','Scale'],[['Cluster of 1,000 points','20/1000','0.02'],['Cluster of 50 points','20/50','0.4']]);note='The centroid ratios are illustrative numerator-noise scales, not complete error bounds: the denominator is noisy too. More iterations use thinner slices of the same budget. There is no universal ε choice; assumptions and the protected unit matter.';}
  if(step===2){table=tableMarkup(['Lecture connection','Key question'],[['McKenna et al. · DP language-model scaling','Jointly choose compute, model size, batch size, noise, and training steps.'],['Rosenblatt et al. · Class imbalance','Compare private augmentation and weighted learning; inspect rare-class utility.'],['Wu et al. · Cape','Hybrid utility and bucketized token sampling for private prompt perturbation.'],['VaultGemma · 1B parameters','Reported ε ≤ 2.0, δ ≤ 1.1 × 10⁻¹⁰ per packed 1,024-token sequence.']]);detail='<p class="calc-note">Read the lecture’s primary sources: <a href="https://proceedings.mlr.press/v267/mckenna25a.html" target="_blank" rel="noopener">McKenna et al.</a> · <a href="https://proceedings.mlr.press/v267/rosenblatt25b.html" target="_blank" rel="noopener">Rosenblatt et al.</a> · <a href="https://proceedings.mlr.press/v267/wu25g.html" target="_blank" rel="noopener">Wu et al. (Cape)</a> · <a href="https://arxiv.org/abs/2510.15001" target="_blank" rel="noopener">VaultGemma</a>.</p>';note='Use the definitions of protection, noise, and accounting from each paper; similar-looking randomness alone does not establish the same guarantee.';}
 }
 return{rows,table,detail,note};
}

function renderCalculation(){
 let context='<span>Equation → substitute → result</span>';
 if(key==='kmeans'){
  const stage=getStage();
  if(stage===1)context+=`<label for="calc-point">Check a point</label><select id="calc-point">${pointSet.map((p,i)=>`<option value="${i}" ${i===focusPoint?'selected':''}>P${i+1} (${f(p[0],2)}, ${f(p[1],2)})</option>`).join('')}</select>`;
  if(stage>=2&&stage<=4)context+=`<label for="calc-cluster">Check a group</label><select id="calc-cluster">${[0,1,2].map(i=>`<option value="${i}" ${i===focusCluster?'selected':''}>C${i+1}</option>`).join('')}</select>`;
 }
 context+='<span class="calc-status">'+esc(key==='kmeans'?`Iteration ${kmframes[step].iter+1} · ${kPrivate?'private':'ordinary'}`:lessons[key].labels[step])+'</span>';
 $('calccontext').innerHTML=context;
 const m=calculation();
 $('calcbody').innerHTML=m.rows.map(r=>`<div class="calc-row"><div><span class="eq-label">${esc(r.name)}</span><div class="eq">${esc(r.formula)}</div></div><div><span class="eq-label">Substitute</span><div class="eq">${esc(r.substitute)}</div></div><div><span class="eq-label">Result</span><div class="eq-value">${esc(r.result)}</div></div></div>`).join('')+m.table+m.detail+`<p class="calc-note">${esc(m.note)}</p>`;
 const point=$('calc-point'),cluster=$('calc-cluster');
 if(point)point.onchange=e=>{pause();focusPoint=Number(e.target.value);render();};
 if(cluster)cluster.onchange=e=>{pause();focusCluster=Number(e.target.value);render();};
}

function renderCoverage(){
 const rows=order.map(k=>`<tr><td>${esc(lessons[k].title)}</td><td>${esc(lessons[k].lecture)}</td><td><button data-topic="${k}">Open topic</button></td></tr>`).join('');
 $('coveragemap').innerHTML='<div class="table-scroll"><table><thead><tr><th scope="col">Topic</th><th scope="col">Lecture slides</th><th scope="col">Open</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
 document.querySelectorAll('[data-topic]').forEach(button=>button.onclick=()=>{openLesson(button.dataset.topic);$('title').scrollIntoView({behavior:'auto',block:'start'});});
}

$('lesson').onchange=e=>openLesson(e.target.value);$('play').onclick=play;$('prev').onclick=()=>{pause();step=Math.max(0,step-1);render(true);};$('next').onclick=()=>{pause();step=Math.min(countStages()-1,step+1);render(true);};$('reset').onclick=()=>{pause();step=0;render();};$('newrun').onclick=newDraw;$('nextlesson').onclick=()=>openLesson(order[order.indexOf(key)+1]);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(document.activeElement.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'){e.preventDefault();play();}if(e.code==='ArrowRight')$('next').click();if(e.code==='ArrowLeft')$('prev').click();});window.addEventListener('hashchange',()=>openLesson(location.hash.slice(1)));$('pace').onchange=e=>{pause();pace=Number(e.target.value);};renderCoverage();generatePoints();openLesson(location.hash.slice(1)||'kmeans');
</script>
